<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
let particles = [];


/* =====================================================
   COLORES
===================================================== */

const PETAL = "#ffd83d";
const PETAL_LIGHT = "#ffe978";

const CENTER = "#5b350b";
const CENTER_LIGHT = "#9b5b16";

const STEM = "#3f8f32";
const LEAF = "#4fa83d";


/* =====================================================
   RESIZE
===================================================== */

function resize() {

    const dpr = window.devicePixelRatio || 1;

    W = window.innerWidth * dpr;
    H = window.innerHeight * dpr;

    canvas.width = W;
    canvas.height = H;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(1, 0, 0, 1, 0, 0);
}

resize();

window.addEventListener("resize", () => {

    resize();
    createBouquet();

});


/* =====================================================
   CREAR LUZ
===================================================== */

function createLight(
    x,
    y,
    size = 1,
    color = PETAL,
    brightness = 1,
    blinkChance = .18
) {

    particles.push({

        x,
        y,

        size,
        color,
        brightness,

        phase:
            Math.random() * Math.PI * 2,

        speed:
            .008 + Math.random() * .025,

        blink:
            Math.random() < blinkChance

    });

}


/* =====================================================
   LÍNEA DE LUCES
===================================================== */

function lineLights(
    x1,
    y1,
    x2,
    y2,
    amount,
    size,
    color
) {

    for (let i = 0; i <= amount; i++) {

        const t = i / amount;

        const x =
            x1 + (x2 - x1) * t;

        const y =
            y1 + (y2 - y1) * t;

        createLight(

            x + (Math.random() - .5) * 2,

            y + (Math.random() - .5) * 2,

            size,

            color,

            .9,

            .08

        );

    }

}


/* =====================================================
   PÉTALO DE GIRASOL
===================================================== */

function sunflowerPetal(
    cx,
    cy,
    angle,
    length,
    width
) {

    const steps =
        Math.floor(length / 2);

    for (let i = 0; i < steps; i++) {

        const t =
            i / steps;

        const distance =
            t * length;

        const petalWidth =
            Math.sin(t * Math.PI) *
            width;

        const offset =
            (Math.random() - .5) *
            petalWidth;

        const x =
            cx +
            Math.cos(angle) * distance +
            Math.cos(angle + Math.PI / 2) *
            offset;

        const y =
            cy +
            Math.sin(angle) * distance +
            Math.sin(angle + Math.PI / 2) *
            offset;

        createLight(

            x,
            y,

            .8 + Math.random() * .65,

            Math.random() < .25
                ? PETAL_LIGHT
                : PETAL,

            .95,

            .22

        );

    }

}


/* =====================================================
   CENTRO DEL GIRASOL
===================================================== */

function flowerCenter(
    cx,
    cy,
    radius
) {

    for (let i = 0; i < 80; i++) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const r =
            Math.sqrt(Math.random()) *
            radius;

        const x =
            cx +
            Math.cos(angle) * r;

        const y =
            cy +
            Math.sin(angle) * r;

        createLight(

            x,
            y,

            .8 + Math.random() * .7,

            Math.random() < .35
                ? CENTER_LIGHT
                : CENTER,

            .9,

            .08

        );

    }


    const ring =
        radius * 1.08;


    for (let i = 0; i < 30; i++) {

        const angle =
            Math.PI * 2 *
            (i / 30);

        createLight(

            cx +
            Math.cos(angle) * ring,

            cy +
            Math.sin(angle) * ring,

            .8,

            PETAL,

            1,

            .15

        );

    }

}


/* =====================================================
   GIRASOL
===================================================== */

function sunflower(
    cx,
    cy,
    radius,
    petals
) {

    /* Primera capa */

    for (let i = 0; i < petals; i++) {

        const angle =
            Math.PI * 2 *
            i / petals;

        sunflowerPetal(

            cx,
            cy,

            angle,

            radius,

            radius * .32

        );

    }


    /* Segunda capa */

    for (let i = 0; i < petals; i++) {

        const angle =
            Math.PI * 2 *
            (i + .5) / petals;

        sunflowerPetal(

            cx,
            cy,

            angle,

            radius * .82,

            radius * .25

        );

    }


    /* Centro */

    flowerCenter(

        cx,
        cy,

        radius * .28

    );

}


/* =====================================================
   HOJA
===================================================== */

function leaf(
    cx,
    cy,
    angle,
    length
) {

    const steps =
        Math.floor(length / 2);

    for (let i = 0; i < steps; i++) {

        const t =
            i / steps;

        const distance =
            t * length;

        const width =
            Math.sin(t * Math.PI) *
            length * .28;

        const offset =
            (Math.random() - .5) *
            width;

        const x =
            cx +
            Math.cos(angle) * distance +
            Math.cos(angle + Math.PI / 2) *
            offset;

        const y =
            cy +
            Math.sin(angle) * distance +
            Math.sin(angle + Math.PI / 2) *
            offset;

        createLight(

            x,
            y,

            .65 + Math.random() * .55,

            Math.random() < .35
                ? "#75c95a"
                : LEAF,

            .9,

            .12

        );

    }

}


/* =====================================================
   CREAR RAMO
===================================================== */

function createBouquet() {

    particles = [];

    const cx = W / 2;
    const cy = H / 2;

    const s =
        Math.min(W, H) / 900;


    /* =================================================
       PUNTO DONDE SE JUNTAN LOS TALLOS
    ================================================= */

    const baseX = cx;

    const baseY =
        cy + 210 * s;


    /* =================================================
       POSICIONES DE LAS FLORES
    ================================================= */

    const stems = [

        {
            x: cx - 95 * s,
            y: cy - 145 * s
        },

        {
            x: cx,
            y: cy - 225 * s
        },

        {
            x: cx + 90 * s,
            y: cy - 145 * s
        },

        {
            x: cx - 155 * s,
            y: cy - 65 * s
        },

        {
            x: cx + 150 * s,
            y: cy - 65 * s
        },

        {
            x: cx - 35 * s,
            y: cy - 80 * s
        }

    ];


    /* =================================================
       TALLOS
       TODOS SE JUNTAN EN LA CANASTA
    ================================================= */

    for (const stem of stems) {

        const steps = 75;

        for (let i = 0; i <= steps; i++) {

            const t =
                i / steps;


            const curve =
                Math.sin(t * Math.PI) *
                (stem.x - baseX) *
                0.12;


            const x =
                baseX +
                (stem.x - baseX) * t +
                curve;


            const y =
                baseY +
                (stem.y - baseY) * t;


            createLight(

                x +
                (Math.random() - .5) * 1.5,

                y +
                (Math.random() - .5) * 1.5,

                .8 +
                Math.random() * .35,

                Math.random() < .25
                    ? "#5eaa43"
                    : STEM,

                .95,

                .08

            );

        }

    }


    /* =================================================
       GIRASOLES GRANDES
    ================================================= */

    sunflower(

        cx - 95 * s,
        cy - 145 * s,

        70 * s,

        18

    );


    sunflower(

        cx,
        cy - 225 * s,

        82 * s,

        20

    );


    sunflower(

        cx + 90 * s,
        cy - 145 * s,

        68 * s,

        18

    );


    /* =================================================
       GIRASOLES PEQUEÑOS
    ================================================= */

    sunflower(

        cx - 155 * s,
        cy - 65 * s,

        40 * s,

        14

    );


    sunflower(

        cx + 150 * s,
        cy - 65 * s,

        40 * s,

        14

    );


    sunflower(

        cx - 35 * s,
        cy - 80 * s,

        38 * s,

        14

    );


    /* =================================================
       HOJAS
    ================================================= */

    const leaves = [

        [
            cx - 95 * s,
            cy + 80 * s,
            -2.7,
            75
        ],

        [
            cx - 120 * s,
            cy + 35 * s,
            -2.5,
            70
        ],

        [
            cx - 70 * s,
            cy + 25 * s,
            2.8,
            65
        ],

        [
            cx + 95 * s,
            cy + 80 * s,
            -.4,
            75
        ],

        [
            cx + 120 * s,
            cy + 35 * s,
            -.65,
            70
        ],

        [
            cx + 70 * s,
            cy + 25 * s,
            .3,
            65
        ],

        [
            cx - 45 * s,
            cy - 5 * s,
            -2.8,
            60
        ],

        [
            cx + 50 * s,
            cy - 10 * s,
            -.35,
            60
        ]

    ];


    for (const data of leaves) {

        leaf(

            data[0],
            data[1],
            data[2],
            data[3] * s

        );

    }


    /* =================================================
       CANASTA
    ================================================= */

    const basketTop =
        cy + 185 * s;

    const basketBottom =
        cy + 340 * s;


    /* =================================================
       BORDE SUPERIOR
    ================================================= */

    lineLights(

        cx - 125 * s,
        basketTop,

        cx + 125 * s,
        basketTop,

        55,

        .9,

        "#d8ad43"

    );


    /* =================================================
       CUERPO DE LA CANASTA
    ================================================= */

    for (let i = 0; i < 16; i++) {

        const t =
            i / 15;


        const x =
            cx -
            125 * s +
            t * 250 * s;


        const bottomWidth =
            95 * s;


        const bottomX =
            cx -
            bottomWidth +
            t *
            bottomWidth *
            2;


        lineLights(

            x,
            basketTop,

            bottomX,
            basketBottom,

            22,

            .65,

            "#c89532"

        );

    }


    /* =================================================
       LÍNEAS HORIZONTALES
    ================================================= */

    for (let i = 0; i < 5; i++) {

        const y =
            basketTop +
            i * 30 * s;


        const width =
            125 * s -
            i * 6 * s;


        lineLights(

            cx - width,
            y,

            cx + width,
            y,

            45,

            .55,

            "#d6a63c"

        );

    }


    /* =================================================
       BORDE INFERIOR
    ================================================= */

    lineLights(

        cx - 95 * s,
        basketBottom,

        cx + 95 * s,
        basketBottom,

        40,

        .7,

        "#b9862d"

    );


    /* =================================================
       MOÑO
    ================================================= */

    const bowX =
        cx;

    const bowY =
        basketTop +
        15 * s;


    /* Centro */

    for (let i = 0; i < 18; i++) {

        createLight(

            bowX +
            (Math.random() - .5) *
            18 * s,

            bowY +
            (Math.random() - .5) *
            12 * s,

            .9,

            "#e2b847",

            1,

            .15

        );

    }


    /* Lazo izquierdo */

    lineLights(

        bowX - 5 * s,
        bowY,

        bowX - 65 * s,
        bowY - 35 * s,

        28,

        .8,

        "#d4aa3c"

    );


    lineLights(

        bowX - 5 * s,
        bowY,

        bowX - 65 * s,
        bowY + 35 * s,

        28,

        .8,

        "#d4aa3c"

    );


    /* Lazo derecho */

    lineLights(

        bowX + 5 * s,
        bowY,

        bowX + 65 * s,
        bowY - 35 * s,

        28,

        .8,

        "#d4aa3c"

    );


    lineLights(

        bowX + 5 * s,
        bowY,

        bowX + 65 * s,
        bowY + 35 * s,

        28,

        .8,

        "#d4aa3c"

    );

}


createBouquet();


/* =====================================================
   DIBUJAR LUCES
===================================================== */

function drawParticle(p) {

    let brightness =
        p.brightness;


    /* Parpadeo */

    if (p.blink) {

        brightness =
            .25 +

            Math.pow(

                (
                    Math.sin(
                        performance.now() *
                        p.speed +
                        p.phase
                    ) + 1
                ) / 2,

                5

            ) * 1.5;

    }


    const radius =
        p.size *
        (1 + brightness * .25);


    /* =================================================
       DETERMINAR COLOR
    ================================================= */

    let rgb;


    if (
        p.color === PETAL ||
        p.color === PETAL_LIGHT
    ) {

        rgb =
            "255,220,70";

    }

    else if (
        p.color === CENTER ||
        p.color === CENTER_LIGHT
    ) {

        rgb =
            "180,105,25";

    }

    else if (
        p.color === STEM ||
        p.color === LEAF ||
        p.color === "#75c95a" ||
        p.color === "#5eaa43"
    ) {

        rgb =
            "70,170,55";

    }

    else {

        rgb =
            "200,150,50";

    }


    /* =================================================
       AURA DE LUZ
    ================================================= */

    const gradient =
        ctx.createRadialGradient(

            p.x,
            p.y,
            0,

            p.x,
            p.y,
            radius * 7

        );


    gradient.addColorStop(

        0,

        `rgba(
            ${rgb},
            ${.9 * brightness}
        )`

    );


    gradient.addColorStop(

        .25,

        `rgba(
            ${rgb},
            ${.45 * brightness}
        )`

    );


    gradient.addColorStop(

        1,

        `rgba(
            ${rgb},
            0
        )`

    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();


    ctx.arc(

        p.x,
        p.y,

        radius * 7,

        0,
        Math.PI * 2

    );


    ctx.fill();


    /* =================================================
       NÚCLEO DE LA LUZ
    ================================================= */

    ctx.fillStyle =
        `rgba(
            ${rgb},
            ${Math.min(1, brightness)}
        )`;


    ctx.beginPath();


    ctx.arc(

        p.x,
        p.y,

        radius,

        0,
        Math.PI * 2

    );


    ctx.fill();


    /* =================================================
       DESTELLO
    ================================================= */

    if (
        p.blink &&
        brightness > 1.3
    ) {

        ctx.strokeStyle =
            `rgba(
                255,
                240,
                140,
                ${brightness * .7}
            )`;


        ctx.lineWidth =
            .6;


        ctx.beginPath();


        ctx.moveTo(

            p.x -
            radius * 5,

            p.y

        );


        ctx.lineTo(

            p.x +
            radius * 5,

            p.y

        );


        ctx.moveTo(

            p.x,

            p.y -
            radius * 5

        );


        ctx.lineTo(

            p.x,

            p.y +
            radius * 5

        );


        ctx.stroke();

    }

}


/* =====================================================
   ANIMACIÓN
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle =
        "#000";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    for (
        const particle of particles
    ) {

        drawParticle(
            particle
        );

    }

}


animate();

</script>

</body>
</html>
